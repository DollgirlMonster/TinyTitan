# CodeQL code scanning — advanced setup.
#
# Why this file exists instead of GitHub's default setup: default setup must
# autobuild, and autobuild runs a bare `swift build`, which builds every product
# in Package.swift — the libraries plus NVMAIMac, NVMAIServer, NVMAICLI,
# NVMAIDecodeService, NVMAIBench and more. That run exceeded 14 minutes without
# finishing and had previously failed, which is why Swift was dropped from the
# default-setup language list and the repository showed "Code scanning
# configuration error".
#
# CodeQL for Swift supports only autobuild and manual (there is no "none" mode,
# because the extractor has to observe a real compilation), so advanced setup is
# the only way to choose a bounded build. The targets below cover the core
# libraries and build in about a minute from a cold cache; the GUI and server
# executables are left out deliberately, because building them is what made
# autobuild time out.
#
# Swift extraction is macOS-only.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: read

# Let a running scan finish: with cancel-in-progress a burst of pushes can
# supersede every scan before one completes, and a security check that never
# finishes reports nothing.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: analyze swift
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      # The build must really happen: this is what the extractor observes.
      # Each target is built explicitly so the scan stays bounded.
      - name: Build for extraction
        run: |
          swift build --target NVMAIFormat
          swift build --target NVMAIKernelsC
          swift build --target NVMAI
          swift build --target ContinuityCore
          swift build --target NVMAIRepackCore
          swift build --target NVMAIDecodeProtocol

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
