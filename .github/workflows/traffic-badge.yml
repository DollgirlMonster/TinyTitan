name: Traffic badge

# Keeps .github/traffic.json in step with the repository's own 14-day traffic.
# The README badge reads that file from the public raw URL, because the traffic
# API itself is private and cannot be reached by an unauthenticated <img>.

on:
  schedule:
    # Daily. GitHub disables scheduled workflows after 60 days without repository
    # activity, so on a dormant repo the badge freezes rather than breaking.
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-badge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the last 14 days of traffic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/traffic/views" > /tmp/traffic.json
          uniques=$(jq '[.views[].uniques] | add // 0' /tmp/traffic.json)
          views=$(jq '[.views[].count] | add // 0' /tmp/traffic.json)
          mkdir -p .github
          jq -n --arg u "$uniques" \
            '{schemaVersion: 1, label: "Visitors (14d)", message: $u, color: "blueviolet"}' \
            > .github/traffic.json
          echo "14-day unique visitors: $uniques (total views: $views)"

      - name: Commit only when the value changed
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/traffic.json; then
            echo "unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/traffic.json
          git commit -m "chore: refresh the 14-day visitor badge"
          git push
