# Phase E verification on an independent host.
#
# The audit standard requires the final verification to run from a fresh clone on
# a host other than the one the work was done on. This workflow IS that host: a
# clean checkout of the audit branch on the `xcode-27` runner, with the pinned
# toolchain installed, running every gate from scratch and refusing to pass while
# the ledger still has open tasks.
#
# It is dispatched by hand (and on every push to an audit branch) so the final
# Phase E run is one command with one log, not a sequence of local steps.
name: Audit verification (Phase E)

on:
  workflow_dispatch:
  push:
    branches:
      - 'audit/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Toolchain versions (record what actually ran)
        run: |
          swift --version
          xcodebuild -version
          python3 --version
          node --version

      - name: Install pinned tools
        run: |
          python3 -m pip install --user --disable-pip-version-check --quiet ruff==0.16.7
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.aarch64.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          echo "/tmp/shellcheck-v0.11.0" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          echo "/tmp" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_darwin_arm64
          chmod +x /tmp/osv-scanner
          echo "/tmp" >> "$GITHUB_PATH"
          # Pinned, not `brew install swiftlint`: `tools/lint.sh`'s swiftlint
          # gate fails when the installed version differs from SWIFTLINT_PIN, and
          # the rule set moves between releases.
          curl -fsSL -o /tmp/swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint-0.65.1
          echo "/tmp/swiftlint-0.65.1" >> "$GITHUB_PATH"

      - name: Plugin tests (harness-version pins)
        run: |
          for plugin in plugins/dsh-*; do
            [ -d "$plugin/test" ] || continue
            echo "::group::$plugin"
            (cd "$plugin" && node --test test/*.test.js)
            echo "::endgroup::"
          done

      - name: Install the pinned JS toolchain
        # The javascript gate needs each plugin's eslint/prettier from its
        # committed package-lock.json and fails when they are absent.
        run: |
          for plugin in plugins/dsh-*; do
            [ -f "$plugin/package.json" ] || continue
            echo "::group::$plugin"
            (cd "$plugin" && npm ci --no-audit --no-fund)
            echo "::endgroup::"
          done

      - name: Clean release build (zero-warning gate)
        run: |
          swift build -c release 2>&1 | tee /tmp/build.log
          if grep -E '^[^ ]+\.(swift|metal|c|h|m|mm):[0-9]+:[0-9]+: warning:' /tmp/build.log; then
            echo "compiler warnings found"
            exit 1
          fi

      - name: Production gates (all eleven)
        run: tools/lint.sh

      - name: Full suite with coverage
        run: |
          swift test --no-parallel --enable-code-coverage 2>&1 | tee /tmp/test.log
          grep -E 'Test run with [0-9]+ tests in [0-9]+ suites passed' /tmp/test.log | tail -8

      - name: Coverage report (sources/ only)
        run: |
          BIN="$(swift build --show-bin-path)"
          xcrun llvm-profdata merge -sparse "$BIN"/codecov/*.profraw -o /tmp/verify.profdata
          for bundle in "$BIN"/*.xctest; do
            binary="$bundle/Contents/MacOS/$(basename "$bundle" .xctest)"
            [ -x "$binary" ] || continue
            echo "== $(basename "$bundle")"
            xcrun llvm-cov report "$binary" -instr-profile=/tmp/verify.profdata \
              -ignore-filename-regex='(\.build/|/tests/)' | tail -1
          done

      - name: Dependency CVEs (Swift)
        run: osv-scanner scan source -L Package.resolved

      - name: Secret scan (full history, config allowlist)
        run: gitleaks detect --source . --log-opts="--all" --config .gitleaks.toml --no-banner

      - name: SwiftLint (strict, committed config)
        run: |
          swiftlint version
          swiftlint lint --strict --quiet --no-cache

      - name: Python suite
        run: |
          cd benchmark
          python3 -m unittest discover -s . -p "test_*.py"

      - name: Ledger closed (Phase E gate)
        run: python3 AUDIT/assert_ledger_closed.py
