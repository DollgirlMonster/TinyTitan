# A trimmed copy of the shipped `standard` preset, around its compaction group
# and one neighbour on each side. The real file resolves through
# `@deepseek-ai/dsh-agent-presets`; the tests use this so they run on a checkout
# with no harness installed.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: present
  name: '@deepseek-ai/dsh-tool-present'
