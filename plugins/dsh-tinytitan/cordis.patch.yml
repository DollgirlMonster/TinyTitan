# Bundle patch: mounts this plugin's own row at the profile root, which is what
# runs its apply() — the llm-pi-ai route is refreshed from the checkout's
# tools/dsh_route.sh, and the compaction preset is generated. No adapter is
# registered: the harness's own llm-pi-ai adapter serves the models, so this row
# adds configuration, not a protocol implementation.
#
# Every field is optional; these are the defaults written out.
- insert:
    - id: dsh-tinytitan
      name: dsh-tinytitan
      config:
        port: 8080
        provider: tinytitan
        registerRoute: true
        writeCompactionPreset: true
        adoptDefaultPreset: true
        setDefaultWhenUnset: true
